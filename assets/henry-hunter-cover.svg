    <text x="42" y="448" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#4ef0eb">✓ Super Currículo Universal + Adaptação por Vaga</text>
    <text x="42" y="470" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#ffc340">✓ Otimização de LinkedIn e Criação de Posts</text>
    <text x="42" y="492" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#fcfaff">✓ Simulador de Entrevistas (Método STAR)</text>
