  <text x="98" y="80" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="12" font-weight="700" fill="#ffc340" letter-spacing="1.4">AGENTE DE IA PARA CARREIRA, CURRÍCULO E VAGAS</text>

