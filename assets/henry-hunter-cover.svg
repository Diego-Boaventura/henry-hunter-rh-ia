    <text x="452" y="272" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="800" fill="#4ef0eb" text-anchor="end">100/100</text>
    <rect x="28" y="282" width="424" height="10" rx="5" fill="#141416"/>
    <rect x="28" y="282" width="424" height="10" rx="5" fill="url(#tealCyan)"/>

    <!-- Bar 3 -->
    <text x="28" y="326" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#fcfaff">3. Força de Resultados, Métricas e Liderança</text>
    <text x="452" y="326" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="800" fill="#ff8559" text-anchor="end">96/100</text>
    <rect x="28" y="336" width="424" height="10" rx="5" fill="#141416"/>
    <rect x="28" y="336" width="406" height="10" rx="5" fill="#ea5c2a"/>

