    <text x="452" y="380" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="800" fill="#ffc340" text-anchor="end">99/100</text>
    <rect x="28" y="390" width="424" height="10" rx="5" fill="#141416"/>
