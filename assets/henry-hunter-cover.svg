<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="50%" stop-color="#1e1e1e"/>
      <stop offset="100%" stop-color="#121818"/>
    </linearGradient>

    <radialGradient id="orangeGlow" cx="18%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#ea5c2a" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ea5c2a" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="tealGlow" cx="85%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#17706e" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#17706e" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="goldGlow" cx="75%" cy="20%" r="35%">
      <stop offset="0%" stop-color="#ffc340" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffc340" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="orangeGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea5c2a"/>
      <stop offset="100%" stop-color="#ffc340"/>
    </linearGradient>

    <linearGradient id="tealCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#17706e"/>
      <stop offset="100%" stop-color="#38c6c2"/>
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262629" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1a1a1d" stop-opacity="0.98"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#fcfaff" stroke-width="0.6" stroke-opacity="0.04"/>
    </pattern>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Base Background -->
  <rect width="1280" height="640" rx="20" fill="url(#bgGrad)"/>
  <rect width="1280" height="640" rx="20" fill="url(#orangeGlow)"/>
  <rect width="1280" height="640" rx="20" fill="url(#tealGlow)"/>
  <rect width="1280" height="640" rx="20" fill="url(#goldGlow)"/>
  <rect width="1280" height="640" rx="20" fill="url(#grid)"/>

  <!-- Decorative Tech Rings -->
  <circle cx="1020" cy="320" r="310" fill="none" stroke="#ea5c2a" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="8 8"/>
  <circle cx="1020" cy="320" r="250" fill="none" stroke="#17706e" stroke-opacity="0.2" stroke-width="1.5"/>

