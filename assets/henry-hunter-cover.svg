  <text x="84" y="346" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="12" font-weight="700" fill="#ffc340" letter-spacing="1.1">CÉREBRO TREINADO COM AS 16 MAIORES REFERÊNCIAS DO MERCADO:</text>
  <text x="84" y="369" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#fcfaff">
