    <text x="34" y="51" font-family="'Segoe UI', 'Sora', Arial, sans-serif" font-size="28" font-weight="900" fill="url(#orangeGold)" text-anchor="middle">HH</text>

    <text x="86" y="48" font-family="'Segoe UI', 'Sora', Arial, sans-serif" font-size="54" font-weight="900" fill="#fcfaff" letter-spacing="1">HENRY HUNTER</text>
